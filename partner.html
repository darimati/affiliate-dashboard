<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>DARIMATI Partner</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet">
<!-- 2026-10-01 사장님 지시: 네이버 히든링크 파트너 8명(러독·발리타잔·정수호·이상학·무브온·김용택·전지영·이지민) 화면 일시 중지.
     옛 화면은 git 이력(62c5a10)에 그대로 있다. 되살리려면 그 커밋의 partner.html·index.html 을 복원하고 deploy.yml 에 생성 단계를 되돌린다. -->
<style>
:root{--bg:#f7f7f8;--card:#fff;--text:#111;--muted:#6b6b6b;--accent:#6366f1;--line:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--card:#151515;--text:#f2f2f2;--muted:#9a9a9a;--line:#2a2a2a}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:440px;width:100%;padding:36px 28px;text-align:center}
.logo{font-size:14px;font-weight:800;letter-spacing:.02em;color:var(--accent);margin-bottom:22px}
h1{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.4;margin-bottom:12px;word-break:keep-all}
p{font-size:15px;line-height:1.7;color:var(--muted);word-break:keep-all}
a.btn{display:inline-block;margin-top:24px;background:var(--text);color:var(--bg);text-decoration:none;font-weight:700;font-size:15px;padding:13px 22px;border-radius:999px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">DARIMATI Partner</div>
  <h1>파트너 정산 화면이<br>잠시 중지되었습니다</h1>
  <p>현재 이 화면은 일시적으로 운영을 멈춘 상태입니다.<br>재개가 필요하시면 담당자에게 연락해 주세요.</p>
  <a class="btn" href="https://www.instagram.com/darimati_official/" target="_blank" rel="noopener">@darimati_official 문의하기</a>
</main>
<script>
/* 쇼피파이 정산으로 옮긴 파트너는 옛 링크로 들어와도 새 화면으로 안내한다 (2026-10-01 사장님 지시)
   옛 토큰 → 새 토큰(company-dari/darimati-dash/partner) */
var MOVED_TO = {
  "WSYl6u-up8zc-gIC69txkw": "eP5viNn07BSy1jYG",   /* 이상학 코치 */
  "moXHJnc9WFD4qd3N__TGtA": "hOVI8Seblq1dDIiy"    /* 러독(안현기) */
};
(function () {
  var t = new URLSearchParams(location.search).get("token"), n = t && MOVED_TO[t];
  if (!n) return;
  var u = "https://company-dari.github.io/darimati-dash/partner/?t=" + n;
  document.querySelector("h1").innerHTML = "정산 화면이<br>새 주소로 옮겨졌습니다";
  document.querySelector("p").innerHTML = "지금부터 공식몰 주문 기준으로 정산됩니다.<br>이전 네이버 실적도 새 화면에 함께 보입니다.";
  var a = document.querySelector("a.btn");
  a.href = u; a.removeAttribute("target"); a.textContent = "새 정산 화면 열기 →";
})();
</script>
</body>
</html>
