name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  # 2026-10-01 일시 중지: 매시 자동 생성 끔 (숫자가 안 바뀌는데 돌던 것)
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 2026-10-01 일시 중지: 파트너 데이터 생성 안 함 → 배포본에서 data/ 가 사라진다(안내문만 공개)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
